
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penny - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Penny ♡</h1>
        <p>Your little space for smarter spending</p>
    </header>

    <main>
        <section class="register-section">

            <h2>Welcome Back! ♡</h2>
            <p>Let's manage your expenses together.</p>

            <form action="/login" method="POST">

                <label>Email Address</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login ♡</button>

            </form>

            <p class="login-link">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

        </section>
    </main>

    <footer>
        <p>Made with ♡ by Penny</p>
    </footer>

</body>
</html>
